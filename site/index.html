<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SNAKE - play in your browser</title>
    <meta name="description" content="Classic Snake written in Python and Pygame, compiled to WebAssembly so it runs in your browser. Arrows, WASD or swipe." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='%23080612'/><path d='M3 8h8v2H3zM9 4h2v4H9z' fill='%2339ff88'/><rect x='12' y='4' width='2' height='2' fill='%23ff2e97'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #080612;
        --green: #39ff88;
        --pink: #ff2e97;
        --cyan: #00e5ff;
        --yellow: #ffe646;
        --dim: #968cbe;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(700px 400px at 50% -80px, rgba(255, 46, 151, 0.25), transparent 70%),
          radial-gradient(600px 400px at 50% 110%, rgba(0, 229, 255, 0.18), transparent 70%),
          var(--bg);
        color: #f0eeff;
        font: 22px/1.3 VT323, monospace;
        display: grid;
        justify-items: center;
        padding: 28px 16px 40px;
      }
      /* CRT scanlines over the whole page */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);
      }
      h1 {
        margin: 0;
        font: 400 clamp(34px, 8vw, 64px) 'Press Start 2P', monospace;
        color: var(--yellow);
        text-shadow: 0 0 12px rgba(255, 230, 70, 0.55), 4px 4px 0 var(--pink);
        letter-spacing: 0.08em;
      }
      .coin {
        margin: 14px 0 22px;
        font-family: 'Press Start 2P', monospace;
        font-size: 11px;
        color: var(--cyan);
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .cabinet {
        width: min(720px, 100%);
        padding: 14px;
        border-radius: 18px;
        background: linear-gradient(#1c1535, #120d25);
        border: 3px solid var(--pink);
        box-shadow: 0 0 0 3px #2a1f4e, 0 0 40px rgba(255, 46, 151, 0.35), inset 0 0 30px rgba(0, 0, 0, 0.6);
      }
      .screen {
        position: relative;
        aspect-ratio: 672 / 600;
        border-radius: 10px;
        overflow: hidden;
        border: 3px solid #000;
        box-shadow: inset 0 0 40px rgba(0, 229, 255, 0.15);
        background: #000;
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 18px;
        margin: 14px 0 2px;
        color: var(--dim);
        font-size: 20px;
      }
      kbd {
        font: 10px 'Press Start 2P', monospace;
        padding: 4px 6px;
        border: 2px solid var(--green);
        border-radius: 4px;
        color: var(--green);
        margin-right: 4px;
      }
      .note {
        max-width: 720px;
        margin: 24px 0 0;
        text-align: center;
        color: var(--dim);
        font-size: 20px;
      }
      a {
        color: var(--cyan);
      }
      @media (prefers-reduced-motion: reduce) {
        .coin {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>SNAKE</h1>
    <p class="coin">INSERT COIN - CLICK THE SCREEN</p>
    <div class="cabinet">
      <div class="screen">
        <iframe src="game/index.html" title="Snake game" allow="autoplay; fullscreen"></iframe>
      </div>
      <p class="controls">
        <span><kbd>ARROWS</kbd>or <kbd>WASD</kbd>move</span>
        <span><kbd>P</kbd>pause</span>
        <span><kbd>SWIPE</kbd>on a phone</span>
      </p>
    </div>
    <p class="note">
      Written in Python and Pygame, compiled to WebAssembly with pygbag - the same code that runs on the desktop.
      <br /><a href="https://github.com/rishabhrayy/snake-game">Code</a> · <a href="https://rishabhray.vercel.app">rishabhray.vercel.app</a>
    </p>
  </body>
</html>
